 y="60" fill="#10231b" font-size="10" class="mono">OFFICIAL SOURCES</text><rect x="184" width="160" height="86" fill="#f1eddf"/><text x="202" y="35" fill="#c34032" font-size="29" font-weight="700">43</text><text x="202" y="60" fill="#10231b" font-size="10" class="mono">MCP TOOLS</text><rect x="368" width="160" height="86" fill="#f1eddf"/><text x="386" y="35" fill="#c34032" font-size="29" font-weight="700">24</text><text x="386" y="60" fill="#10231b" font-size="10" class="mono">PUBLIC PRODUCTS</text></g><path class="dash" d="M74 284H548" stroke="#d8b86f" stroke-width="3" stroke-dasharray="10 10"/><g fill="#f1eddf"><circle cx="74" cy="284" r="10"/><circle cx="232" cy="284" r="10"/><circle cx="390" cy="284" r="10"/><circle cx="548" cy="284" r="10"/></g><g fill="#f1eddf" font-size="12" class="mono"><text x="52" y="322">SOURCE</text><text x="205" y="322">CONTRACT</text><text x="374" y="322">SDK</text><text x="532" y="322">MCP</text></g><text x="34" y="432" fill="#f1eddf" font-size="40" font-weight="700">MCP · REST · MAPS</text><text x="34" y="474" fill="#d8e0da" font-size="15">Bilingual evidence products with citations,</text><text x="34" y="500" fill="#d8e0da" font-size="15">quality boundaries and reproducible access.</text><rect class="sweep" x="-260" y="0" width="220" height="560" fill="white" opacity=".04"/></g><text x="76" y="618" fill="#10231b" font-size="11" class="mono" letter-spacing="1.5">INDEPENDENT · OPEN SOURCE · NOT AFFILIATED WITH THE UAE GOVERNMENT</text></svg>