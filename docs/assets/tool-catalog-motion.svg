<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Runtime-generated MCP tool catalogue</title>
  <desc id="desc">Runtime registrations generate Markdown, JSON and an MCP resource, with CI checking that all outputs remain current.</desc>
  <style>
    @font-face{font-family:Dubai;src:url('https://fonts.cdnfonts.com/s/10524/Dubai-Regular.woff') format('woff')}
    .bg{fill:#07110f}.grid{stroke:#14322b;stroke-width:1}.box{fill:#0b1b17;stroke:#2e705d;stroke-width:2}.accent{fill:#d5ff52}.txt{fill:#eafff8;font-family:Dubai,Arial,sans-serif}.muted{fill:#81aa9e;font-family:Dubai,Arial,sans-serif}.flow{fill:none;stroke:#d5ff52;stroke-width:3;stroke-dasharray:12 10;animation:dash 2.2s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-44}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>
  <rect class="bg" width="1200" height="360"/>
  <path class="grid" d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200M0 300h1200M120 0v360M240 0v360M360 0v360M480 0v360M600 0v360M720 0v360M840 0v360M960 0v360M1080 0v360" opacity=".45"/>
  <text class="muted" x="54" y="55" font-size="18" letter-spacing="3">UAEMCP · SINGLE SOURCE OF TRUTH</text>
  <rect class="box" x="54" y="106" width="260" height="150"/>
  <circle class="accent pulse" cx="84" cy="137" r="7"/>
  <text class="txt" x="105" y="144" font-size="25">Runtime registrations</text>
  <text class="muted" x="82" y="188" font-size="18">38 tools · actual server</text>
  <text class="muted" x="82" y="220" font-size="18">names · kinds · descriptions</text>
  <path class="flow" d="M314 181H420"/>
  <rect class="box" x="420" y="82" width="330" height="198"/>
  <text class="txt" x="450" y="126" font-size="25">Generated catalogue</text>
  <text class="muted" x="450" y="169" font-size="19">MCP_TOOLS.md</text>
  <text class="muted" x="450" y="204" font-size="19">mcp-tools.json</text>
  <text class="muted" x="450" y="239" font-size="19">uae://tools</text>
  <path class="flow" d="M750 181H856"/>
  <rect class="box" x="856" y="106" width="290" height="150"/>
  <circle class="accent pulse" cx="886" cy="137" r="7"/>
  <text class="txt" x="907" y="144" font-size="25">Release gate</text>
  <text class="muted" x="884" y="188" font-size="18">CI rejects stale outputs</text>
  <text class="muted" x="884" y="220" font-size="18">docs always match runtime</text>
  <text class="muted" x="54" y="325" font-size="16">Deterministic · machine-readable · agent-discoverable</text>
</svg>
