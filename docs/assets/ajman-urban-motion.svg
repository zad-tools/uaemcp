<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">Ajman Urban Evidence</title><desc id="d">Six separate official urban data series retain their own units.</desc><style>text{font-family:Dubai,Arial,sans-serif}.m{font:12px monospace;letter-spacing:1.5px}.h{font-size:48px;font-weight:700}.n{font-size:19px;font-weight:700}.line{stroke-dasharray:8 10;animation:move 4s linear infinite}.p{animation:pulse 2s ease-in-out infinite}.d1{animation-delay:.6s}.d2{animation-delay:1.2s}@keyframes move{to{stroke-dashoffset:-72}}@keyframes pulse{50%{r:9;opacity:.35}}@media(prefers-reduced-motion:reduce){.line,.p{animation:none}}</style><rect width="1200" height="460" fill="#f1eddf"/><rect width="1200" height="72" fill="#173d2d"/><text x="48" y="45" fill="#f1eddf" class="m">OPEN EMIRATES INTELLIGENCE / AJMAN URBAN / 1.63.0</text><text x="48" y="142" fill="#10271e" class="h">SIX SERIES. THEIR OWN UNITS.</text><g transform="translate(48 190)"><rect width="330" height="148" fill="#173d2d"/><text x="24" y="38" fill="#cbb56f" class="m">BUILDING</text><text x="24" y="80" fill="#f1eddf" class="n">Permissions + licences</text><text x="24" y="112" fill="#c4d2ca">buildings / licences</text></g><g transform="translate(435 190)"><rect width="330" height="148" fill="#173d2d"/><text x="24" y="38" fill="#cbb56f" class="m">CERTIFIED RENT</text><text x="24" y="80" fill="#f1eddf" class="n">Ajman + Masfout</text><text x="24" y="112" fill="#c4d2ca">contracts</text></g><g transform="translate(822 190)"><rect width="330" height="148" fill="#173d2d"/><text x="24" y="38" fill="#cbb56f" class="m">MOBILITY</text><text x="24" y="80" fill="#f1eddf" class="n">Roads + crossroads</text><text x="24" y="112" fill="#c4d2ca">km / developed crossings</text></g><path class="line" d="M378 264H435M765 264H822" stroke="#c94133" stroke-width="3"/><circle class="p" cx="378" cy="264" r="5" fill="#c94133"/><circle class="p d1" cx="600" cy="264" r="5" fill="#c94133"/><circle class="p d2" cx="822" cy="264" r="5" fill="#c94133"/><rect x="48" y="378" width="1104" height="48" fill="#c94133"/><text x="600" y="408" fill="#f1eddf" text-anchor="middle" class="m">NO COMPOSITE SCORE · NO PROPERTY RETURN · NO GROWTH CLAIM</text></svg>
