<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">UAE Connectivity Pulse</title>
  <desc id="desc">Three separate animated TDRA monthly series for active mobile subscriptions, broadband subscriptions per 100 inhabitants, and fixed lines per 100 inhabitants.</desc>
  <style>
    .bg{fill:#f1eddf}.ink{fill:#10271e}.forest{fill:#173d2d}.red{fill:#c94133}.gold{fill:#cbb56f}.line{stroke:#10271e;stroke-width:2;fill:none}.muted{fill:#66736b}.label{font:700 15px Dubai,Arial,sans-serif;letter-spacing:1.6px}.copy{font:18px Dubai,Arial,sans-serif}.num{font:700 58px Dubai,Arial,sans-serif}.small{font:14px Dubai,Arial,sans-serif}.trace{fill:none;stroke-width:6;stroke-linecap:square;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4.8s ease-in-out infinite}.dot{animation:pulse 4.8s ease-in-out infinite;transform-origin:center}.scan{animation:scan 4.8s ease-in-out infinite}.fade{animation:fade 4.8s ease-in-out infinite}@keyframes draw{0%,12%{stroke-dashoffset:900}55%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,42%{transform:scale(.2);opacity:0}55%,90%{transform:scale(1);opacity:1}100%{transform:scale(.2);opacity:0}}@keyframes scan{0%{transform:translateX(-760px);opacity:0}15%{opacity:.22}70%{opacity:.22}85%,100%{transform:translateX(760px);opacity:0}}@keyframes fade{0%,10%{opacity:.35}32%,88%{opacity:1}100%{opacity:.35}}@media(prefers-reduced-motion:reduce){.trace,.dot,.scan,.fade{animation:none}.trace{stroke-dashoffset:0}}
  </style>
  <rect class="bg" width="1200" height="620"/>
  <rect class="forest" x="0" y="0" width="1200" height="78"/>
  <text x="48" y="49" class="label" fill="#f1eddf">OPEN EMIRATES / TDRA CONNECTIVITY LEDGER</text>
  <text x="1152" y="49" class="label" fill="#cbb56f" text-anchor="end">2011—2025 · MONTHLY</text>
  <line x1="48" y1="148" x2="1152" y2="148" class="line"/>
  <text x="48" y="126" class="label ink">THREE SERIES. ZERO COMPOSITE SCORES.</text>
  <g transform="translate(48 184)">
    <rect width="1104" height="112" fill="none" stroke="#10271e" stroke-width="2"/>
    <rect width="255" height="112" class="red"/>
    <text x="24" y="35" class="label" fill="#f1eddf">ACTIVE MOBILE</text>
    <text x="24" y="86" class="num" fill="#f1eddf">24.28M</text>
    <polyline class="trace" stroke="#c94133" points="294,84 352,78 410,80 468,68 526,60 584,51 642,44 700,49 758,38 816,31 874,26 932,18 1048,12"/>
    <circle class="dot red" cx="1048" cy="12" r="9"/>
  </g>
  <g transform="translate(48 318)">
    <rect width="1104" height="112" fill="none" stroke="#10271e" stroke-width="2"/>
    <rect width="255" height="112" class="forest"/>
    <text x="24" y="35" class="label" fill="#f1eddf">BROADBAND / 100</text>
    <text x="24" y="86" class="num gold">51.4</text>
    <polyline class="trace" stroke="#173d2d" points="294,91 352,87 410,82 468,75 526,70 584,64 642,59 700,52 758,47 816,39 874,31 932,22 1048,13"/>
    <circle class="dot forest" cx="1048" cy="13" r="9"/>
  </g>
  <g transform="translate(48 452)">
    <rect width="1104" height="112" fill="none" stroke="#10271e" stroke-width="2"/>
    <rect width="255" height="112" fill="#cbb56f"/>
    <text x="24" y="35" class="label ink">FIXED LINES / 100</text>
    <text x="24" y="86" class="num ink">20.4</text>
    <polyline class="trace" stroke="#b58e3c" points="294,23 352,26 410,32 468,39 526,44 584,51 642,56 700,62 758,68 816,75 874,81 932,87 1048,92"/>
    <circle class="dot gold" cx="1048" cy="92" r="9"/>
  </g>
  <rect class="scan" x="48" y="184" width="2" height="380" fill="#10271e"/>
  <text x="48" y="598" class="small muted fade">SUBSCRIPTIONS ARE NOT UNIQUE PEOPLE · PER-100 VALUES ARE NOT COVERAGE, SPEED, QUALITY OR AFFORDABILITY</text>
</svg>
