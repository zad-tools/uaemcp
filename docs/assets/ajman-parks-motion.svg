<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Ajman Parks Footfall evidence flow</title><desc id="d">Official monthly Ajman park visit observations become separate annual columns and source-native park labels, with the warning that visits are not unique people.</desc><style>@font-face{font-family:Dubai;src:url('../fonts/DubaiW23-Regular.woff2')}text{font-family:Dubai,Arial,sans-serif}.b{animation:g 4s ease-in-out infinite;transform-origin:bottom}@keyframes g{50%{transform:scaleY(.72)}}@media(prefers-reduced-motion:reduce){.b{animation:none}}</style><rect width="1200" height="520" fill="#f2efe4"/><path d="M40 40H1160V480H40Z" fill="none" stroke="#173d2d"/><text x="70" y="98" fill="#10271e" font-size="34" font-weight="700">AJMAN PARKS FOOTFALL</text><text x="1130" y="94" text-anchor="end" fill="#c84234" font-size="18">VISITS ≠ UNIQUE PEOPLE</text><line x1="70" y1="390" x2="780" y2="390" stroke="#9ca39c"/><g fill="#173d2d"><rect class="b" x="90" y="215" width="72" height="175"/><rect class="b" x="185" y="198" width="72" height="192" style="animation-delay:.25s"/><rect class="b" x="280" y="238" width="72" height="152" style="animation-delay:.5s"/><rect class="b" x="375" y="289" width="72" height="101" style="animation-delay:.75s"/><rect class="b" x="470" y="100" width="72" height="290" style="animation-delay:1s"/><rect class="b" x="565" y="260" width="72" height="130" style="animation-delay:1.25s"/><rect class="b" x="660" y="138" width="72" height="252" style="animation-delay:1.5s"/></g><g fill="#10271e" font-size="15"><text x="126" y="420" text-anchor="middle">2017</text><text x="221" y="420" text-anchor="middle">2018</text><text x="316" y="420" text-anchor="middle">2019</text><text x="411" y="420" text-anchor="middle">2020</text><text x="506" y="420" text-anchor="middle">2021</text><text x="601" y="420" text-anchor="middle">2022</text><text x="696" y="420" text-anchor="middle">2023</text></g><rect x="820" y="145" width="310" height="245" fill="#d9ff70" stroke="#173d2d"/><text x="850" y="190" fill="#10271e" font-size="19" font-weight="700">EVIDENCE BOUNDARY</text><text x="850" y="238" fill="#10271e" font-size="17">1,128 published rows</text><text x="850" y="272" fill="#10271e" font-size="17">8 invalid values excluded</text><text x="850" y="306" fill="#10271e" font-size="17">source-native park labels</text><text x="850" y="350" fill="#c84234" font-size="15">NO DEMAND OR QUALITY SCORE</text></svg>
