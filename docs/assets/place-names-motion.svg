<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">UAE National Place Names</title><desc id="desc">Animated official gazetteer search connecting Arabic and English place names to mapped coordinates.</desc>
  <rect width="1200" height="420" fill="#f1eddf"/><style>text{font-family:Dubai,Arial,sans-serif;fill:#10271e}.small{font-size:15px;font-weight:700;letter-spacing:3px}.title{font-size:57px;font-weight:700}.name{font-size:34px;font-weight:700}.line{stroke:#10271e;stroke-width:2}.map{fill:#153f2d}.grid{stroke:#f1eddf;stroke-width:1;opacity:.18}.pin{fill:#cb4032;animation:pulse 2.4s ease-in-out infinite}.pin.two{animation-delay:.8s}.pin.three{animation-delay:1.6s}.route{fill:none;stroke:#d1bf83;stroke-width:4;stroke-dasharray:420;stroke-dashoffset:420;animation:route 4s ease-in-out infinite}@keyframes pulse{0%,100%{r:7;opacity:1}50%{r:19;opacity:.25}}@keyframes route{0%,15%{stroke-dashoffset:420}65%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}@media(prefers-reduced-motion:reduce){.pin,.route{animation:none;stroke-dashoffset:0}}</style>
  <text class="small" x="55" y="52">OPEN EMIRATES INTELLIGENCE / 1.61.1</text><text class="title" x="55" y="120">ONE PLACE. TWO NAMES.</text>
  <rect class="map" x="55" y="160" width="1090" height="190"/><path class="grid" d="M55 223h1090M55 286h1090M273 160v190M491 160v190M709 160v190M927 160v190"/>
  <path class="route" d="M170 284C330 170 438 304 595 225S864 180 1040 260"/><circle class="pin" cx="170" cy="284" r="7"/><circle class="pin two" cx="595" cy="225" r="7"/><circle class="pin three" cx="1040" cy="260" r="7"/>
  <text class="name" x="110" y="205" fill="#f1eddf">دبي / DUBAI</text><text class="name" x="487" y="330" fill="#f1eddf">العين / AL AIN</text><text class="name" x="895" y="205" fill="#f1eddf">خورفكان</text>
  <line class="line" x1="55" y1="378" x2="1145" y2="378"/><text class="small" x="55" y="408">OFFICIAL FGIC · LIVE ARCGIS · NORMALIZED · SOURCE-CITED</text>
</svg>
