<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">UAE Tourism Pulse</title>
  <desc id="desc">Animated editorial preview of five separate national annual tourism metrics with an explicit guests-not-unique-tourists boundary.</desc>
  <style>
    @font-face{font-family:Dubai;src:url('../assets/fonts/Dubai-Regular.woff')}@font-face{font-family:Dubai;src:url('../assets/fonts/Dubai-Bold.woff');font-weight:700}
    text{font-family:Dubai,Arial,sans-serif}.line{stroke-dasharray:920;stroke-dashoffset:920;animation:draw 4.8s cubic-bezier(.22,1,.36,1) infinite}.pulse{animation:pulse 4.8s ease-out infinite}.scan{animation:scan 4.8s cubic-bezier(.22,1,.36,1) infinite}@keyframes draw{0%,12%{stroke-dashoffset:920}58%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,40%{opacity:0;transform:translateY(10px)}58%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}@keyframes scan{0%,10%{transform:translateX(-600px)}68%,100%{transform:translateX(1450px)}}@media(prefers-reduced-motion:reduce){.line,.pulse,.scan{animation:none}.line{stroke-dashoffset:0}.pulse{opacity:1}}
  </style>
  <rect width="1440" height="720" fill="#eee8d8"/><rect x="0" y="0" width="1440" height="66" fill="#eee8d8" stroke="#14251e"/>
  <text x="54" y="41" font-size="16" font-weight="700" letter-spacing="2.2" fill="#14251e">OPEN EMIRATES / TOURISM PULSE</text><text x="1190" y="41" font-size="14" fill="#14251e">EN / العربية</text>
  <rect x="0" y="66" width="840" height="522" fill="#eee8d8" stroke="#14251e"/><text x="55" y="127" font-size="14" font-weight="700" letter-spacing="2.5" fill="#c83d32">OFFICIAL NATIONAL SERIES / ANNUAL</text>
  <text x="53" y="232" font-size="90" font-weight="700" letter-spacing="-5" fill="#14251e">UAE TOURISM</text><text x="53" y="317" font-size="90" font-weight="700" letter-spacing="-5" fill="#14251e">PULSE</text>
  <g transform="translate(57 374)"><line x1="0" y1="130" x2="700" y2="130" stroke="#8e9992"/><path class="line" d="M0 112 L140 95 L280 104 L420 58 L560 74 L700 20" fill="none" stroke="#c83d32" stroke-width="7"/><g fill="#eee8d8" stroke="#14251e" stroke-width="4"><circle cx="0" cy="112" r="8"/><circle cx="140" cy="95" r="8"/><circle cx="280" cy="104" r="8"/><circle cx="420" cy="58" r="8"/><circle cx="560" cy="74" r="8"/><circle cx="700" cy="20" r="8"/></g><rect class="scan" x="0" y="0" width="3" height="145" fill="#c5a967" opacity=".9"/><text x="0" y="160" font-size="13" fill="#66736c">ANNUAL OBSERVATIONS · ONE METRIC AT A TIME</text></g>
  <rect x="840" y="66" width="600" height="522" fill="#16402e"/><text x="900" y="128" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c5a967">EVIDENCE SCOPE</text><text x="900" y="205" font-size="52" font-weight="700" fill="#eee8d8">NATIONAL</text><text x="900" y="259" font-size="52" font-weight="700" fill="#eee8d8">ANNUAL</text><text x="900" y="313" font-size="52" font-weight="700" fill="#eee8d8">AGGREGATES</text>
  <g class="pulse"><rect x="900" y="371" width="224" height="94" fill="none" stroke="#789183"/><text x="925" y="414" font-size="34" font-weight="700" fill="#eee8d8">5</text><text x="925" y="441" font-size="13" fill="#c5a967">SEPARATE METRICS</text><rect x="1124" y="371" width="252" height="94" fill="none" stroke="#789183"/><text x="1149" y="414" font-size="34" font-weight="700" fill="#eee8d8">YEAR</text><text x="1149" y="441" font-size="13" fill="#c5a967">BOUNDED RANGE</text></g>
  <rect x="0" y="588" width="1440" height="132" fill="#c83d32"/><text x="54" y="651" font-size="38" font-weight="700" fill="#eee8d8">GUESTS ≠ UNIQUE TOURISTS</text><text x="54" y="685" font-size="19" fill="#eee8d8">DESCRIPTIVE TREND ≠ CAUSALITY</text><text x="956" y="651" font-size="22" font-weight="700" fill="#eee8d8">OCCUPANCY</text><text x="956" y="684" font-size="18" fill="#eee8d8">SOURCE FRACTION × 100 → %</text>
</svg>
