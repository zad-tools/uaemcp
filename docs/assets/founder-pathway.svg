<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">UAE Founder Pathway</title><desc id="desc">An animated three-step journey from company setup to startup support and residency readiness.</desc>
  <rect width="1200" height="420" fill="#f2efe7"/><style>text{font-family:Dubai,Arial,sans-serif;fill:#13261d}.small{font-size:16px;font-weight:700;letter-spacing:3px}.title{font-size:62px;font-weight:700}.num{font-size:62px;font-weight:700}.line{stroke:#13261d;stroke-width:2}.pulse{fill:#ff6847;animation:p 3s ease-in-out infinite}.two{animation-delay:1s}.three{animation-delay:2s}.check{fill:none;stroke:#13261d;stroke-width:3}.tick{fill:none;stroke:#ff6847;stroke-width:5;stroke-dasharray:45;stroke-dashoffset:45;animation:tick 3s ease-in-out infinite}.tick.two{animation-delay:1s}.tick.three{animation-delay:2s}@keyframes p{0%,100%{r:7;opacity:1}45%{r:18;opacity:.2}}@keyframes tick{0%,20%{stroke-dashoffset:45}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:45}}@media(prefers-reduced-motion:reduce){.pulse,.tick{animation:none;stroke-dashoffset:0}}</style>
  <text class="small" x="55" y="55">OPEN EMIRATES INTELLIGENCE / 1.61.1</text><text class="title" x="55" y="130">FOUNDER ACTION DOSSIER.</text>
  <line class="line" x1="55" y1="200" x2="1145" y2="200"/><circle class="pulse" cx="120" cy="200" r="7"/><circle class="pulse two" cx="585" cy="200" r="7"/><circle class="pulse three" cx="1060" cy="200" r="7"/>
  <text class="num" x="75" y="290">01</text><text class="small" x="75" y="325">OFFICIAL SETUP</text><text class="num" x="540" y="290">02</text><text class="small" x="540" y="325">FOUNDER SUPPORT</text><text class="num" x="1015" y="290">03</text><text class="small" x="905" y="325">RESIDENCY READINESS</text>
  <rect class="check" x="75" y="338" width="24" height="24"/><path class="tick" d="M80 350l7 7 15-18"/><rect class="check" x="540" y="338" width="24" height="24"/><path class="tick two" d="M545 350l7 7 15-18"/><rect class="check" x="1015" y="338" width="24" height="24"/><path class="tick three" d="M1020 350l7 7 15-18"/>
  <rect x="55" y="365" width="1090" height="1" fill="#13261d"/><text class="small" x="55" y="398">NO NAME · NO EMAIL · NOTHING STORED · OFFICIAL LINKS FIRST</text>
</svg>
