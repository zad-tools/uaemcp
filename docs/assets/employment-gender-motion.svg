<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MOHRE employment by gender, 2020 to 2024</title>
  <desc id="desc">Animated parallel bars show male and female percentage shares separately for five years.</desc>
  <style>@font-face{font-family:Dubai;src:url('/assets/fonts/Dubai-Regular.woff')}text{font-family:Dubai,Arial,sans-serif;fill:#eee9da}.label{font-size:17px}.year{font-size:18px;font-weight:700}.male{fill:#4f9abd}.female{fill:#e85b4c}.track{fill:#263b33}@media(prefers-reduced-motion:no-preference){.bar{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}.r2{animation-delay:.1s}.r3{animation-delay:.2s}.r4{animation-delay:.3s}.r5{animation-delay:.4s}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}}</style>
  <rect width="1200" height="420" fill="#11251d"/><text x="55" y="54" font-size="26" font-weight="700">EMPLOYMENT BY GENDER · MOHRE · 2020—2024</text><text x="1145" y="54" class="label" text-anchor="end">PERCENTAGE SHARE · NOT COUNTS</text>
  <g transform="translate(55 92)">
    <g><text class="year" y="29">2020</text><rect class="track" x="75" width="1000" height="30"/><rect class="bar male" x="75" width="894.461" height="14"/><rect class="bar female" x="75" y="16" width="105.539" height="14"/></g>
    <g transform="translate(0 55)"><text class="year r2" y="29">2021</text><rect class="track" x="75" width="1000" height="30"/><rect class="bar male r2" x="75" width="887.911" height="14"/><rect class="bar female r2" x="75" y="16" width="112.089" height="14"/></g>
    <g transform="translate(0 110)"><text class="year" y="29">2022</text><rect class="track" x="75" width="1000" height="30"/><rect class="bar male r3" x="75" width="881.709" height="14"/><rect class="bar female r3" x="75" y="16" width="118.291" height="14"/></g>
    <g transform="translate(0 165)"><text class="year" y="29">2023</text><rect class="track" x="75" width="1000" height="30"/><rect class="bar male r4" x="75" width="868.578" height="14"/><rect class="bar female r4" x="75" y="16" width="131.422" height="14"/></g>
    <g transform="translate(0 220)"><text class="year" y="29">2024</text><rect class="track" x="75" width="1000" height="30"/><rect class="bar male r5" x="75" width="858.127" height="14"/><rect class="bar female r5" x="75" y="16" width="141.873" height="14"/></g>
  </g><g transform="translate(55 390)"><rect class="male" width="15" height="15"/><text class="label" x="24" y="14">MALE</text><rect class="female" x="105" width="15" height="15"/><text class="label" x="129" y="14">FEMALE</text><text class="label" x="1090" y="14" text-anchor="end">SUM = 100% · VALIDATION ONLY</text></g>
</svg>
