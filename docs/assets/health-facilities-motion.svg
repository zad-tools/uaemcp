<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">UAE Health Facilities Atlas</title><desc id="d">Official aggregate facility counts from 2015 to 2024 with evidence boundaries.</desc><style>text{font-family:Dubai,Arial,sans-serif}.m{font:12px monospace;letter-spacing:1.4px}.h{font-size:46px;font-weight:700}.n{font-size:19px;font-weight:700}.bar{transform-origin:left;animation:grow 4s cubic-bezier(.22,1,.36,1) infinite}.y2{animation-delay:.35s}.y3{animation-delay:.7s}.dot{animation:pulse 2.2s ease-in-out infinite}@keyframes grow{0%,12%{transform:scaleX(.08)}55%,100%{transform:scaleX(1)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.bar,.dot{animation:none}}</style><rect width="1200" height="460" fill="#f1eddf"/><rect width="1200" height="72" fill="#175c79"/><text x="48" y="45" fill="#f1eddf" class="m">OPEN EMIRATES INTELLIGENCE / HEALTH FACILITIES / 1.65.0</text><text x="48" y="137" fill="#10271e" class="h">TEN YEARS. SEVEN EMIRATES. CLEAR LIMITS.</text><g transform="translate(48 180)"><text y="20" fill="#10271e" class="n">DUBAI</text><rect class="bar" x="150" y="2" width="650" height="24" fill="#175c79"/><text x="820" y="21" fill="#10271e" class="n">3,528</text><text y="78" fill="#10271e" class="n">ABU DHABI</text><rect class="bar y2" x="150" y="60" width="397" height="24" fill="#173d2d"/><text x="567" y="79" fill="#10271e" class="n">2,155</text><text y="136" fill="#10271e" class="n">SHARJAH</text><rect class="bar y3" x="150" y="118" width="166" height="24" fill="#d66a3b"/><text x="336" y="137" fill="#10271e" class="n">898</text></g><g transform="translate(945 182)"><circle class="dot" cx="72" cy="72" r="70" fill="#c94133"/><text x="72" y="67" text-anchor="middle" fill="#f1eddf" class="h">7,392</text><text x="72" y="94" text-anchor="middle" fill="#f1eddf" class="m">2024 REPORTED</text></g><rect x="48" y="378" width="1104" height="48" fill="#c94133"/><text x="600" y="408" fill="#f1eddf" text-anchor="middle" class="m">AGGREGATE COUNTS ≠ FACILITY DIRECTORY · BEDS · CAPACITY · QUALITY</text></svg>
