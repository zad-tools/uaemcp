<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">UAE Startup Support Navigator</title>
  <desc id="desc">Animated evidence-first route from startup stage and support need to verified UAE support programmes.</desc>
  <style>
    text{font-family:"Dubai",Arial,sans-serif}.label{font-size:12px;letter-spacing:2px}.small{font-size:11px}.title{font-size:52px;font-weight:700}.card{fill:#f0ecdc;stroke:#183c2c;stroke-width:1}.wire{fill:none;stroke:#d4ba6d;stroke-width:2;stroke-dasharray:8 8;animation:flow 2.2s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.scan{animation:scan 3.8s ease-in-out infinite}.delay{animation-delay:.7s}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(306px)}}@media(prefers-reduced-motion:reduce){.wire,.pulse,.scan{animation:none}}
  </style>
  <rect width="1200" height="520" fill="#10261e"/>
  <path d="M0 72h1200M0 448h1200" stroke="#597065" opacity=".5"/>
  <text x="56" y="42" class="label" fill="#d4ba6d">OPEN EMIRATES INTELLIGENCE / STARTUP SUPPORT</text>
  <text x="1144" y="42" text-anchor="end" class="label" fill="#f0ecdc">VERIFIED 17 JUL 2026</text>
  <text x="56" y="130" class="title" fill="#f0ecdc">FROM NEED TO OFFICIAL PROGRAMME.</text>
  <text x="56" y="164" font-size="18" fill="#91a69b">Privacy-first discovery across federal and emirate-backed support.</text>

  <g transform="translate(56 212)">
    <rect class="card" width="190" height="164"/>
    <text x="18" y="29" class="label" fill="#c33f33">01 / CURRENT STAGE</text>
    <text x="18" y="67" font-size="24" font-weight="700" fill="#10261e">IDEA</text>
    <text x="18" y="96" font-size="24" font-weight="700" fill="#10261e">MVP</text>
    <text x="18" y="125" font-size="24" font-weight="700" fill="#10261e">REVENUE</text>
    <text x="18" y="151" class="small" fill="#65736b">OR GROWTH</text>
  </g>
  <path class="wire" d="M246 294h88"/>
  <circle class="pulse" cx="290" cy="294" r="6" fill="#c33f33"/>

  <g transform="translate(334 212)">
    <rect width="238" height="164" fill="#185c79" stroke="#d4ba6d"/>
    <text x="18" y="29" class="label" fill="#d4ba6d">02 / SUPPORT NEED</text>
    <text x="18" y="68" font-size="20" font-weight="700" fill="#f0ecdc">MENTORSHIP · INCUBATION</text>
    <text x="18" y="101" font-size="20" font-weight="700" fill="#f0ecdc">MARKET · FINANCING</text>
    <text x="18" y="134" font-size="20" font-weight="700" fill="#f0ecdc">WORKSPACE · LOCATION</text>
    <rect class="scan" x="18" y="150" width="26" height="3" fill="#d4ba6d"/>
  </g>
  <path class="wire" d="M572 294h88"/>
  <circle class="pulse delay" cx="616" cy="294" r="6" fill="#c33f33"/>

  <g transform="translate(660 194)">
    <rect width="484" height="200" fill="#173d2d" stroke="#f0ecdc"/>
    <text x="20" y="31" class="label" fill="#d4ba6d">03 / EVIDENCE-BACKED MATCHES</text>
    <g class="small" fill="#f0ecdc">
      <text x="20" y="67">MBRIF</text><text x="174" y="67">EDB</text><text x="318" y="67">HUB71</text>
      <text x="20" y="105">DUBAI SME</text><text x="174" y="105">SHERAA</text><text x="318" y="105">RUWAD</text>
      <text x="20" y="143">AJMAN REYADA</text><text x="174" y="143">9 PROGRAMMES</text><text x="318" y="143">OFFICIAL LINKS</text>
    </g>
    <path d="M20 162h444" stroke="#5e786b"/>
    <text x="20" y="184" class="small" fill="#c33f33">RELEVANCE ≠ ELIGIBILITY, ACCEPTANCE OR FUNDING APPROVAL</text>
  </g>

  <text x="56" y="479" class="label" fill="#f0ecdc">NO NAME · NO EMAIL · NO PHONE · NO PITCH DECK · NO PASSPORT STORED</text>
  <text x="1144" y="479" text-anchor="end" class="label" fill="#d4ba6d">WEB + REST + MCP / DUBAI FONT</text>
</svg>
