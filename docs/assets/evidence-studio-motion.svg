<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">UAE Evidence Studio</title><desc id="desc">Selected evidence pillars are composed without blending incompatible measures.</desc><defs><style>
  @font-face{font-family:Dubai;src:url('/assets/fonts/Dubai-Regular.woff')}
  text{font-family:Dubai,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  @keyframes sweep{0%{transform:translateX(-260px)}100%{transform:translateX(1320px)}}
  @keyframes rise{from{transform:scaleY(.08)}to{transform:scaleY(1)}}
  @keyframes dash{to{stroke-dashoffset:-48}}
  @keyframes blink{0%,45%{opacity:1}50%,100%{opacity:.25}}
  @media(prefers-reduced-motion:no-preference){.sweep{animation:sweep 7s linear infinite}.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}.dash{animation:dash 4s linear infinite}.blink{animation:blink 1.8s steps(1) infinite}}
  @media(prefers-reduced-motion:reduce){.sweep,.rise,.dash,.blink{animation:none}}
