<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">UAE Evidence Studio</title><desc id="desc">Five official evidence pillars compose into one source-cited dossier without a composite score.</desc>
  <style>
    text{font-family:Dubai,Arial,sans-serif}.label{font:700 12px monospace;letter-spacing:2px}.card{animation:enter 5s infinite both}.c2{animation-delay:.35s}.c3{animation-delay:.7s}.c4{animation-delay:1.05s}.c5{animation-delay:1.4s}.line{stroke-dasharray:8 9;animation:flow 1.8s linear infinite}@keyframes enter{0%,8%{opacity:.15;transform:translateX(-22px)}22%,88%{opacity:1;transform:none}100%{opacity:.15}}@keyframes flow{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.card,.line{animation:none}}
  </style>
  <rect width="1200" height="500" fill="#f1eddf"/><text x="55" y="55" fill="#c94133" class="label">COMPOSE / VERIFY / KEEP THE SOURCE</text>
  <text x="55" y="115" fill="#10271e" font-size="45" font-weight="700">UAE Evidence Studio</text><text x="55" y="150" fill="#68756d" font-size="18">Two to five official pillars. One bilingual dossier. Zero invented synthesis.</text>
  <g class="card c1" transform="translate(55 205)"><rect width="190" height="105" fill="#173d2d"/><text x="18" y="34" fill="#d9ff70" class="label">EDUCATION</text><text x="18" y="72" fill="#f1eddf" font-size="17">Period + unit</text></g>
  <g class="card c2" transform="translate(55 325)"><rect width="190" height="105" fill="#175c79"/><text x="18" y="34" fill="#cbb56f" class="label">HEALTH</text><text x="18" y="72" fill="#f1eddf" font-size="17">Scope + limits</text></g>
  <g class="card c3" transform="translate(265 205)"><rect width="190" height="105" fill="#173d2d"/><text x="18" y="34" fill="#d9ff70" class="label">INDUSTRY</text><text x="18" y="72" fill="#f1eddf" font-size="17">Bounded sample</text></g>
  <g class="card c4" transform="translate(265 325)"><rect width="190" height="105" fill="#175c79"/><text x="18" y="34" fill="#cbb56f" class="label">TAX ACTIVITY</text><text x="18" y="72" fill="#f1eddf" font-size="17">Source-native</text></g>
  <path class="line" d="M475 317H650" fill="none" stroke="#c94133" stroke-width="3"/><path d="m640 307 14 10-14 10" fill="none" stroke="#c94133" stroke-width="3"/>
  <g class="card c5" transform="translate(680 190)"><rect width="465" height="255" fill="#10271e"/><text x="30" y="42" fill="#d9ff70" class="label">SOURCE-CITED DOSSIER</text><text x="30" y="95" fill="#f1eddf" font-size="33" font-weight="700">Evidence travels together.</text><text x="30" y="135" fill="#9ba39d" font-size="18">Unlike units remain separate.</text><line x1="30" y1="166" x2="435" y2="166" stroke="#607168"/><text x="30" y="202" fill="#cbb56f" class="label">PRINT / MARKDOWN / JSON</text><text x="30" y="232" fill="#f1eddf" class="label">NO LLM · NO PII · NO STORAGE</text></g>
</svg>
