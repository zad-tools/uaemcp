<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">UAE Policy Evidence Watch workflow</title><desc id="d">Five official UAE policy surfaces become bounded excerpts, SHA-256 fingerprints and an evidence change ledger.</desc><style>@font-face{font-family:Dubai;src:url('../fonts/DubaiW23-Regular.woff2')}text{font-family:Dubai,Arial,sans-serif}.pulse{animation:p 3s ease-in-out infinite}.flow{stroke-dasharray:12 10;animation:f 5s linear infinite}@keyframes p{50%{opacity:.35}}@keyframes f{to{stroke-dashoffset:-88}}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}</style><rect width="1200" height="520" fill="#080b0d"/><path d="M40 45H1160V475H40Z" fill="none" stroke="#323b3f"/><text x="70" y="92" fill="#fff" font-size="32" font-weight="700">UAE POLICY EVIDENCE WATCH</text><text x="1130" y="90" fill="#98a2a7" font-size="18" text-anchor="end">PAGE CHANGE ≠ LEGAL CHANGE</text><g fill="#111719" stroke="#3a464b"><rect x="70" y="135" width="270" height="52"/><rect x="70" y="199" width="270" height="52"/><rect x="70" y="263" width="270" height="52"/><rect x="70" y="327" width="270" height="52"/><rect x="70" y="391" width="270" height="52"/></g><g fill="#e8edef" font-size="17"><text x="90" y="168">UAE LEGISLATION</text><text x="90" y="232">FTA LEGISLATION</text><text x="90" y="296">MOHRE RESOLUTIONS</text><text x="90" y="360">ICP ANNOUNCEMENTS</text><text x="90" y="424">UAE CABINET NEWS</text></g><path class="flow" d="M365 289H500M700 289H835" stroke="#00c878" stroke-width="3"/><g><rect x="500" y="198" width="200" height="182" fill="#0c1214" stroke="#00c878"/><text x="600" y="245" fill="#00c878" font-size="19" text-anchor="middle">BOUNDED EVIDENCE</text><text x="600" y="286" fill="#fff" font-size="17" text-anchor="middle">short excerpts</text><text x="600" y="318" fill="#fff" font-size="17" text-anchor="middle">SHA-256 hashes</text><text x="600" y="350" fill="#98a2a7" font-size="15" text-anchor="middle">no full-page mirror</text></g><g><rect x="835" y="154" width="295" height="270" fill="#0c1214" stroke="#3a464b"/><text x="865" y="198" fill="#fff" font-size="21">CHANGE LEDGER</text><circle class="pulse" cx="875" cy="238" r="6" fill="#00c878"/><text x="895" y="244" fill="#d9e2e5" font-size="16">FIRST SNAPSHOT</text><circle cx="875" cy="282" r="6" fill="#68757a"/><text x="895" y="288" fill="#d9e2e5" font-size="16">UNCHANGED</text><circle cx="875" cy="326" r="6" fill="#ffb020"/><text x="895" y="332" fill="#d9e2e5" font-size="16">CONTENT CHANGED</text><circle cx="875" cy="370" r="6" fill="#ff4d4f"/><text x="895" y="376" fill="#d9e2e5" font-size="16">CHECK FAILED</text></g></svg>
