g><g transform="translate(476 372)"><rect width="404" height="340" fill="#f1eddf"/><text x="30" y="42" fill="#829188" font-size="10" class="mono">FEDERAL PALETTE</text><rect x="30" y="72" width="344" height="50" fill="#173d2d"/><rect x="30" y="122" width="344" height="50" fill="#c34032"/><rect x="30" y="172" width="344" height="50" fill="#d8b86f"/><rect x="30" y="222" width="344" height="50" fill="#10231b"/><text x="30" y="310" fill="#10231b" font-size="10" class="mono">FOREST · UNION RED · SAND · INK</text></g><g transform="translate(904 372)"><rect width="448" height="340" fill="#e8e1ce"/><text x="30" y="42" fill="#829188" font-size="10" class="mono">REGISTRY PACKAGES</text><rect x="30" y="70" width="388" height="220" fill="#10231b"/><text x="52" y="112" fill="#d8b86f" font-size="13" class="mono">npm install</text><text x="52" y="158" fill="#f1eddf" font-size="15" class="mono">@open-emirates/contracts</text><text x="52" y="196" fill="#f1eddf" font-size="15" class="mono">@open-emirates/sdk</text><text x="52" y="234" fill="#f1eddf" font-size="15" class="mono">@open-emirates/mcp</text><rect class="blink" x="52" y="254" width="10" height="17" fill="#c34032"/></g></svg>