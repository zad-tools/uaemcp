name: publish-npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Build the exact registry tarball
        id: pack
        run: |
          archive=$(npm pack --silent)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the packed CLI with Bun
        run: |
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          bun init -y >/dev/null
          bun add "$GITHUB_WORKSPACE/${{ steps.pack.outputs.archive }}" >/dev/null
          test "$(./node_modules/.bin/uaemcp --version)" = "${GITHUB_REF_NAME#v}"
          ./node_modules/.bin/uaemcp doctor
      - name: Publish the tested tarball with provenance
        run: npm publish "${{ steps.pack.outputs.archive }}" --access public --provenance
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.archive }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.archive }}" --verify-tag --title "Open Emirates Intelligence $GITHUB_REF_NAME" --generate-notes
          fi
